[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for the lawyer project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.4.11",
    "docx2txt>=0.9",
    "fastapi>=0.135.3",
    "langchain-community>=0.3.24",
    "langchain-openai>=0.3.11",
    "langgraph-checkpoint-postgres>=2.0.0",
    "msoffcrypto-tool>=5.4.2",
    "networkx>=3.4.2",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "psycopg[binary]>=3.2.9",
    "pydantic-settings>=2.9.1",
    "pymilvus>=2.5.8",
    "pypdf>=5.4.0",
    "python-docx>=1.1.2",
    "python-multipart>=0.0.20",
    "redis>=6.4.0",
    "sqlalchemy>=2.0.40",
    "unstructured==0.18.18",
    "uvicorn[standard]>=0.42.0",
    "xlrd>=2.0.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.2.0",
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[project.scripts]
backend = "app:main"

[tool.uv.build-backend]
module-name = "app"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"
